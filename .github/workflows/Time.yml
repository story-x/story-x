name: Progress Bar CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Update README.md
      run: node index.js > README.md
    - name: Commit change & Push
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '76933341+github-actions[bot]@users.noreply.github.com'
        git commit -am "bot: update README.md automatically" || exit 0
        git push
